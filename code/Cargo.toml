[package]
name = "fs-dbs"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-bls12-381 = { git = "https://github.com/arkworks-rs/algebra.git", rev = "750e28aab9fb5d66d4b7f8d8d9510bba633ae89d" }
ark-ec = { git = "https://github.com/arkworks-rs/algebra.git", rev = "750e28aab9fb5d66d4b7f8d8d9510bba633ae89d" }
ark-ff = { git = "https://github.com/arkworks-rs/algebra.git", rev = "750e28aab9fb5d66d4b7f8d8d9510bba633ae89d" }
ark-serialize = { git = "https://github.com/arkworks-rs/algebra.git", rev = "750e28aab9fb5d66d4b7f8d8d9510bba633ae89d" }
ark-secp256r1 = { git = "https://github.com/arkworks-rs/algebra.git", rev = "750e28aab9fb5d66d4b7f8d8d9510bba633ae89d", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "zeroize"] }

[profile.release]
codegen-units = 1
lto = "thin"

[features]
std-backend = ["ark-ec/std", "ark-ff/std", "ark-serialize/std"]
