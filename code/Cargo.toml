[package]
name = "fs-dbs-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.11"
csv = "1.3"
ark-bls12-381 = "0.5"
ark-secp256r1 = { version = "0.5", features = ["std"] }
ark-ec = "0.5"
ark-ff = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"
ed25519-dalek = "3.0"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
